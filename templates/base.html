<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}UH OH CUSSMS{% endblock %}</title>
	<link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column vh-100">
	<nav class="navbar navbar-expand-lg px-bg-dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="{{ url_for('index') }}" style="color: white; padding-left: 20px;">UH OH CUSSMS</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					{% if session.get('username') %}
						<li class="nav-item">
							<span class="navbar-text">Logged in as {{ session['username'] }}</span>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="{{ url_for('dashboard') }}" style="color: white;">Dashboard</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="{{ url_for('logout') }}" style="color: white;">Logout</a>
						</li>
					{% else %}
						<li class="nav-item">
							<a class="nav-link" href="{{ url_for('login') }}" style="color: white;">Login</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="{{ url_for('register_user') }}" style="color: white;">Register</a>
						</li>
					{% endif %}
				</ul>
			</div>
		</div>
	</nav>
	<div class="flex-grow-1 d-flex flex-column px-bg-darkgreenblue">
		{% block content %}
		{% endblock %}
	</div>
	<footer class="text-center py-3 px-bg-dark">
		<div class="container-fluid">
			<p class="mb-0">2024 UH OH CUSSMS by Sc00by</p>
		</div>
	</footer>
	{% block scripts %}{% endblock %}
	<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
