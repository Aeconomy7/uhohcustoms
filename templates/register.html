{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center">
	<div class="card p-4 shadow px-bg-inverted" style="width: 100%; max-width: 400px;">
	<!-- <div class="card p-5 shadow px-bg-inverted"> -->
		<h3 class="text-center mb-2">Register</h3>
		<form action="{{ url_for('register') }}" method="post">
			<div class="mb-2">
				<label for="username" class="form-label">Username</label>
				<input type="text" id="username" name="username" class="form-control" required>
			</div>
			<div class="mb-2">
				<label for="username" class="form-label">Email</label>
				<input type="text" id="email" name="email" class="form-control" required>
			</div>
			<div class="mb-2">
				<label for="password" class="form-label">Password</label>
				<input type="password" id="password" name="password" class="form-control" required>
			</div>
			<div class="mb-2">
				<label for="confirm_password" class="form-label">Confirm Password</label>
				<input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
			</div>
			<div class="mb-2">
				<button type="submit" class="btn btn-primary w-100" style="padding-top: 10px;">Register</button>
			</div>
		</form>
		<!-- Alert messages -->
		<div class="mt-2">
		{% with messages = get_flashed_messages(with_categories=true) %}
			{% if messages %}
				{% for message in messages %}
					<div class="alert alert-{{ message[0] }} mb-2">
						{{ message[1] }}
					</div>
				{% endfor %}
			{% endif %}
		{% endwith %}
		</div>
		<div class="text-center">
			<p class="mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
		</div>
	</div>
</div>
{% endblock %}
