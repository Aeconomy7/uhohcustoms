{% extends "base.html" %}

{% block content %}
<div class="container-fluid vh-100">
	<div class="row h-100">

	<!-- Left Panel for Player Data -->
	<div class="col-md-4 bg-light border-end px-bg-inverted">
		<div class="p-3">
		<h3 class="mb-4">Players</h3>
			<table class="table table-striped table-bordered">
				<thead>
					<tr>
						<th class="col-1 champion">CHAMP</th>
						<th class="col-4player-name">PLAYER</th>
						<th class="col-1 kda">KILLS</th>
						<th class="col-1 kda">DEATHS</th>
						<th class="col-1 kda">ASSISTS</th>
					</tr>
				</thead>
				<tbody>
					<!-- Rows populated dynamically via Socket.IO -->
				</tbody>
			</table>
		</div>
	</div>

	<!-- Right Panel for Event Data -->
	<div class="col-md-8 px-bg-darkgreenblue">
		<div class="p-3">
		<h3 class="mb-4">Live Game Events</h3>
			<div class="table-responsive px-bg-inverted">
				<table class="table table-striped table-bordered">
					<thead>
						<tr>
							<th class="col-2 event-no">EVENT #</th>
							<th class="col-2 game-time">GAME TIME</th>
							<th class="col-8 event-info">INFO</th>
						</tr>
					</thead>
					<tbody>
						<!-- Rows populated dynamically via Socket.IO -->
					</tbody>
				</table>
			</div>
		</div>
	</div>

	</div>
</div>
{% endblock %}

{% block scripts %}
<script>
	document.addEventListener("DOMContentLoaded", function() {
		var socket = io.connect(window.location.origin);

		// Handle event data
		socket.on("event_data", function(event) {
			const eventTable = document.querySelector("#events tbody");

			const row = document.createElement("tr");
			row.innerHTML = `
				<td>${event.event_id}</td>
				<td>${event.game_time}</td>
				<td>${event.message}</td>
			`;

			eventTable.appendChild(row);
		});

		// Handle player data
		socket.on("add_player_data", function(event) {
			const teamTable = document.querySelector("#teams tbody");

			event.forEach(function(player) {
				const playerId = player.player_name.replace("#", "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
				let existingRow = document.getElementById(playerId);

				if (existingRow) {
					existingRow.innerHTML = `
						<td><img src="/static/img/champions/${player.champion.replace(/[' .]/g, "").toLowerCase()}.png" width="50px" height="50px" style="padding: 10px;" /></td>
						<td>${player.player_name}</td>
						<td>${player.kills}</td>
						<td>${player.deaths}</td>
						<td>${player.assists}</td>
					`;
				} else {
					const row = document.createElement("tr");
					row.id = playerId;
					row.classList.add(player.team);
					row.innerHTML = `
						<td><img src="/static/img/champions/${player.champion.replace(/[' .]/g, "").toLowerCase()}.png" width="50px" height="50px" style="padding: 10px;" /></td>
						<td>${player.player_name}</td>
						<td>${player.kills}</td>
						<td>${player.deaths}</td>
						<td>${player.assists}</td>
					`;

					teamTable.appendChild(row);
				}
			});
		});

		// Update player data
		socket.on("update_player_data", function(event) {
			event.forEach(function(player) {
				const playerId = player.player_name.replace("#", "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
				const row = document.getElementById(playerId);
				if (row) {
					row.children[2].textContent = player.kills;
					row.children[3].textContent = player.deaths;
					row.children[4].textContent = player.assists;
				}
			});
		});
	});
</script>
{% endblock %}
