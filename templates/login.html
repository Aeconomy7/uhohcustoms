{% extends "base.html" %}

{% block content %}
<div class="d-flex flex-column flex-remaining-height justify-content-center align-items-center h-100 w-100">
	<div class="card p-4 shadow px-bg-inverted" style="border: 1px solid cyan; width: 100%; max-width: 400px;">
		<h3 class="text-center mb-2">Login</h3>
		<form action="{{ url_for('login') }}" method="post">
			<div class="mb-2">
				<label for="email" class="form-label">Email</label>
				<input type="text" id="email" name="email" class="form-control" required>
			</div>
			<div class="mb-2">
				<label for="password" class="form-label">Password</label>
				<input type="password" id="password" name="password" class="form-control" required>
			</div>
			<button type="submit" class="btn btn-primary w-100">Login</button>
		</form>
		<!-- Alert messages -->
		<div class="mt-2">
		{% with messages = get_flashed_messages(with_categories=true) %}
			{% if messages %}
				{% for message in messages %}
					<div class="alert alert-{{ message[0] }} mb-2">
						{{ message[1] }}
					</div>
				{% endfor %}
			{% endif %}
		{% endwith %}
		</div>
		<div class="text-center">
			<p class="mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
		</div>
	</div>
</div>
{% endblock %}
