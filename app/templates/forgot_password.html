{% extends "base.html" %}

{% block content %}
<div class="d-flex flex-column flex-remaining-height justify-content-center align-items-center w-100">
	<div class="card p-4 shadow px-bg-inverted" style="border: 1px solid cyan; width: 100%; max-width: 400px;">
		<h3 class="text-center mb-2">Reset password</h3>
		<form method="POST" action="{{ url_for('forgot_password') }}">
            <label for="email">Enter your email address:</label>
            <input type="email" id="email" name="email" required>
            <button type="submit">Send Reset Link</button>
        </form>
		<!-- Alert messages -->
		<div class="mt-2">
		{% with messages = get_flashed_messages(with_categories=true) %}
			{% if messages %}
				{% for message in messages %}
					<div class="alert alert-{{ message[0] }} mb-2">
						{{ message[1] }}
					</div>
				{% endfor %}
			{% endif %}
		{% endwith %}
		</div>
		<div class="text-center">
			<p class="mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
		</div>
	</div>
</div>
{% endblock %}
